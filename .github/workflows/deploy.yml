name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Adaptar repo espejado para build sin workspace pnpm
        run: |
          # El monorepo usa @zas/config via workspace:*; npm no lo entiende.
          sed -i '/"@zas\/config": "workspace:\*"/d' package.json
          # Sustituimos la config de ESLint compartida por una vacía para el build.
          echo 'export default [];' > eslint.config.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
